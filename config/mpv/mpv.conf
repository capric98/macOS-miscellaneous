# Use ModernZ instead of the built-in controller.
osc=no
watch-later-options-remove=sub-pos

# Hide macOS window decorations and the built-in OSD bar.
border=no
osd-bar=no

# Limit automatic window sizing to 90% of the screen.
autofit-larger=90%x90%

# Keep the last playlist entry open at EOF.
keep-open=yes

# Prefer supported hardware decoders; fall back to software if needed.
hwdec=auto

# Allow native font discovery and fallback for the statistics overlay.
osd-font-provider=auto

# Use high-quality GPU rendering without debanding.
vo=gpu-next
profile=high-quality
deband=no
