# PotPlayer-style bindings. D/F also work with Shift or Caps Lock.
d       frame-back-step
D       frame-back-step
f       frame-step
F       frame-step
ENTER   cycle fullscreen
SPACE   cycle pause
UP      add volume 5
DOWN    add volume -5
TAB     script-binding stats/display-stats-toggle

# Additional frame-step keys, for English and Chinese punctuation.
,       frame-back-step
.       frame-step
，      frame-back-step
。      frame-step
